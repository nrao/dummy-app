name: CD
on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm-dummyapp/**'

jobs:
  prep_env:
    uses: ./.github/workflows/prep-env.yml

  docker_cd:
    name: Build docker container
    runs-on: ubuntu-latest
    needs: [prep_env]
    outputs:
      image_tags: ${{ steps.meta.outputs.tag-names }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prep_env.outputs.image_name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - name: Login to GitHub container registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry.localhost:5432"]
              http = true

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ needs.prep_env.outputs.app_version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops:
    name: Update dev GitOps environment
    runs-on: ubuntu-latest
    needs: [docker_cd]
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: nrao/releng-aws-gitops
          token: "${{ secrets.GH_REPO_PAT }}"
          path: ./gitops

      - name: Update dev environment image tag
        run: |
          cd gitops/
          imageTag="$(echo "${{ needs.docker_cd.outputs.image_tags }}" | grep 'sha-')"
          echo "./scripts/setEnvTag.sh dummy-app aws-dev staging $imageTag"
          # chmod +x ./scripts/setEnvTag.sh
          # ./scripts/setEnvTag.sh dummy-app aws-dev staging "$imageTag"
          # git config user.email "cd@nrao.edu"
          # git config user.name "CD Bot"
          # git add .
          # git commit -m "chore(dev): Set dummy-app/aws-dev image tag to $imageTag"
          # git push origin main
