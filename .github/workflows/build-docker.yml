name : 'Build docker container'
on:
  pull_request:
    branches: [main]
    types: ["labeled", "unlabeled", "opened", "synchronize", "reopened"]
    paths-ignore:
      - 'helm-dummyapp/**'

jobs:
  prep_env:
    uses: ./.github/workflows/prep-env.yml

  docker_pr_app:
    runs-on: ubuntu-latest
    needs: [prep_env]
    steps:
      - uses: actions/checkout@v7

      - name: Docker app image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.APP_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Login to GitHub container registry
        if: ${{ needs.prep_env.outputs.should_publish == 'true' && !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Login to Nexus
        if: ${{ needs.prep_env.outputs.should_publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: nrao.repo.sonatype.app
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry.localhost:5432"]
              http = true

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ needs.prep_env.outputs.app_version }}
          push: ${{ needs.prep_env.outputs.should_publish == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_pr_test:
    runs-on: ubuntu-latest
    needs: [prep_env]
    steps:
      - uses: actions/checkout@v7

      - name: Docker tester image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.TEST_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Login to GitHub container registry
        if: ${{ needs.prep_env.outputs.should_publish == 'true' && !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Login to Nexus
        if: ${{ needs.prep_env.outputs.should_publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: nrao.repo.sonatype.app
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry.localhost:5432"]
              http = true

      - name: Build tester image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tester.dockerfile
          push: ${{ needs.prep_env.outputs.should_publish == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
